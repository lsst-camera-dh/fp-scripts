# BOT EO configuration file

# specify which acquisition sequences to run
#
[ACQUIRE]
#bias
flat


# Bias
#
[BIAS]
ANNOTATION=ts8-fp
LOCATIONS=R22
COUNT=1         # number of bias frames, for BIAS image & noise analysis

# Flat
#
[FLAT]
BCOUNT=1        # number of bias frames per flat image pair
WL    =SDSSr	# wavelength filter to use for the flats
HILIM =800.0    # maximum seconds for a flat field exposure
LOLIM =0.10    # minimum seconds for a flat field exposure
FILTERCONFIG = /home/ccs/projects/fp-scripts-LSSTTD-1644/examples_ts8/calib.cfg
LOCATIONS=R22

flat=         10000 empty	 # signal level desired, in e-/pixel, ND filter #
#flat=         200000 empty	 # signal level desired, in e-/pixel, ND filter #
